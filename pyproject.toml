[project]
name = "11-image-classifier-pytorch"
version = "0.1.0"
description = "CNN and ResNet from scratch on CIFAR-10, transfer learning on Food-101, own training loop on MPS"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
